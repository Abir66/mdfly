version: 2

project_name: mdfly

before:
  hooks:
    - go mod tidy

builds:
  - id: mdfly
    main: ./cmd/mdfly
    binary: mdfly
    env:
      - CGO_ENABLED=0
    # Without this the released binary reports the compiled-in default "dev",
    # and the once-per-24h update check can never conclude it is current.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # scripts/install.sh only ever fetches .tar.gz, but a Windows user unpacks
    # by hand and expects a zip.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# The cask, not the deprecated `brews` formula. Lives in a sibling tap repo
# because Homebrew resolves `Abir66/mdfly/mdfly` to `Abir66/homebrew-mdfly`.
homebrew_casks:
  - name: mdfly
    binaries: [mdfly]
    description: CLI-driven markdown sharing service
    homepage: https://mdfly.dev
    repository:
      owner: Abir66
      name: homebrew-mdfly
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaser
      email: noreply@mdfly.dev
    # The binary is neither signed nor notarized, so Gatekeeper quarantines it
    # on download and every invocation dies until the attribute is cleared.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/mdfly"]
          end

# No generated changelog: the release notes are the hand-written CHANGELOG.md
# section for this version, which the workflow extracts and hands to goreleaser
# via --release-notes. A commit log cannot say why a release is worth installing,
# and filtering one only ever approximates that.
changelog:
  disable: true

release:
  # Pinned rather than inferred from the git remote, so the cask's download URLs
  # are identical no matter which clone or fork the release runs from.
  github:
    owner: Abir66
    name: mdfly
  # No `footer` here on purpose: --release-notes replaces the whole body, header
  # and footer included. The install block lives in .github/release-footer.md and
  # the workflow appends it to the extracted notes.
