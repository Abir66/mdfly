version: 2

project_name: mdfly

before:
  hooks:
    - go mod tidy

builds:
  - id: mdfly
    main: ./cmd/mdfly
    binary: mdfly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
