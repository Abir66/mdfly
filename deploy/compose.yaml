# Production stack for the backend VM (ADR-0003). Caddy is the only service that
# publishes a host port. Postgres is not here — it is managed and off-box, reached
# through DATABASE_URL (ADR-0005).
#
# Values come from the repo-root .env. No `${...}` interpolation anywhere, so no
# command needs --env-file and no host-shell variable can leak in. Run compose from
# this directory, or point it here with -f.

name: mdfly

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mdfly-server:local
    command: ["serve"]
    restart: unless-stopped
    env_file: ../.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_started

  # The periodic work — lifecycle GC and CDN purge drain — in its own process
  # (ADR-0003). Same image, same .env, no published port and no HTTP surface at
  # all: it stamps each pass into the job_runs table, and that row is how its
  # liveness is read. **Exactly one of these runs**, which is what preserves the
  # single-writer premise behind the purge drain's lease-free claim.
  #
  # Its shutdown budget is its own and much larger than the web tier's: no caller
  # waits on a GC pass, but killing one mid-batch throws the batch away. The
  # invariant nothing enforces mechanically: stop_grace_period > SHUTDOWN_TIMEOUT,
  # or Docker SIGKILLs the process before its drain can finish.
  jobs:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mdfly-server:local
    command: ["jobs"]
    restart: unless-stopped
    env_file: ../.env
    environment:
      SHUTDOWN_TIMEOUT: 115s
    stop_grace_period: 120s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    # No `ports:` — that omission is what keeps Redis private, not the firewall.

  # One-shot: `docker compose run --rm migrate`. `$$` escapes Compose's
  # interpolation so the container's shell expands DATABASE_URL from env_file,
  # not from whatever the host shell has exported.
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    env_file: ../.env
    entrypoint: ["/bin/sh", "-c"]
    command: ['migrate -path=/migrations -database="$$DATABASE_URL" up']
    volumes:
      - ../migrations:/migrations:ro

volumes:
  redis-data:
  caddy-data:
  caddy-config:
