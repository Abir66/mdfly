# Production stack for the backend VM (ADR-0003). Caddy is the only service that
# publishes a host port. Postgres is not here — it is managed and off-box, reached
# through DATABASE_URL (ADR-0005).
#
# Values come from the repo-root .env, and no command needs --env-file. The one
# `${...}` here is MDFLY_IMAGE, which deploy.sh writes into this directory's own
# .env — a generated, secret-free file Compose reads for interpolation only. Its
# fallback is a name that cannot exist, so an un-deployed stack fails at the pull
# with an obvious message rather than starting something stale. Run compose from
# this directory, or point it here with -f.

name: mdfly

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    # No depends_on a web slot: the Caddyfile names both permanently and health
    # checks decide which is reachable, so Caddy must be able to boot with either
    # one absent — and depending on a slot would resurrect the one a swap just
    # stopped.

  # The web tier is two fixed slots, `app_blue` and `app_green` (ADR-0015),
  # identical apart from name and both running `serve`. A deploy starts the idle
  # slot, waits for its /healthz, then stops the live one; Caddy's config is not
  # touched.
  #
  # Only blue is in the default profile, so a bare `docker compose up -d` brings
  # up one web slot plus jobs, Redis and Caddy — never both slots. Green is
  # started explicitly: `docker compose --profile green up -d app_green`. Caddy
  # prefers blue whenever it is healthy, so a bare `up -d` while green is the live
  # slot takes traffic back to blue's image; after a swap onto green, leave blue
  # stopped until the next deploy.
  #
  # Both slots carry the tail of the deploy timeout chain, which must strictly
  # increase and which nothing enforces mechanically:
  #   request ceiling 30s (serverWriteTimeout) < SHUTDOWN_TIMEOUT 35s < stop_grace_period 45s
  # Below the drain budget, an in-flight request outlives its slot being stopped;
  # above the grace period, Docker SIGKILLs the process mid-drain.
  app_blue:
    image: ${MDFLY_IMAGE:-mdfly-server:unset}
    command: ["serve"]
    restart: unless-stopped
    env_file: ../.env
    environment:
      SHUTDOWN_TIMEOUT: 35s
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_started

  app_green:
    profiles: ["green"]
    image: ${MDFLY_IMAGE:-mdfly-server:unset}
    command: ["serve"]
    restart: unless-stopped
    env_file: ../.env
    environment:
      SHUTDOWN_TIMEOUT: 35s
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_started

  # The periodic work — lifecycle GC and CDN purge drain — in its own process
  # (ADR-0003). Same image, same .env, no published port and no HTTP surface at
  # all: it stamps each pass into the job_runs table, and that row is how its
  # liveness is read. **Exactly one of these runs**, which is what preserves the
  # single-writer premise behind the purge drain's lease-free claim.
  #
  # Its shutdown budget is its own and much larger than the web tier's: no caller
  # waits on a GC pass, but killing one mid-batch throws the batch away. The
  # invariant nothing enforces mechanically: stop_grace_period > SHUTDOWN_TIMEOUT,
  # or Docker SIGKILLs the process before its drain can finish.
  jobs:
    image: ${MDFLY_IMAGE:-mdfly-server:unset}
    command: ["jobs"]
    restart: unless-stopped
    env_file: ../.env
    environment:
      SHUTDOWN_TIMEOUT: 115s
    stop_grace_period: 120s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    # No `ports:` — that omission is what keeps Redis private, not the firewall.

  # One-shot: `docker compose run --rm migrate`. `$$` escapes Compose's
  # interpolation so the container's shell expands DATABASE_URL from env_file,
  # not from whatever the host shell has exported.
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    env_file: ../.env
    entrypoint: ["/bin/sh", "-c"]
    command: ['migrate -path=/migrations -database="$$DATABASE_URL" up']
    volumes:
      - ../migrations:/migrations:ro

volumes:
  redis-data:
  caddy-data:
  caddy-config:
