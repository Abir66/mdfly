# mdfly production stack for the Oracle Always Free VM (ADR-0003).
#
# Caddy is the only service that publishes a host port. Postgres, Redis, and the
# Go server are reachable on the compose bridge network only — see
# docs/deploy/oracle-vm-setup.md.
#
# Values come from deploy/.env, which Compose loads from this file's directory
# for both `${...}` interpolation and the app's `env_file`. Copy
# .env.example to .env and fill it in before the first `up`.

name: mdfly

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mdfly-server:local
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -q"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    # No `ports:` — deliberate. See docs/deploy/redis-rate-limit-setup.md §3.

  # One-shot: `docker compose run --rm migrate`. The `tools` profile keeps it out
  # of `docker compose up`. DATABASE_URL is read from the container environment
  # at run time (`$$` escapes Compose's own interpolation), so the command works
  # from any working directory.
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command: ['migrate -path=/migrations -database="$$DATABASE_URL" up']
    volumes:
      - ../migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
