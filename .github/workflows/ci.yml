name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -short ./...
      # deploy.sh is the one piece of the deploy that carries branching logic, and
      # its tests stub docker and git, so they need nothing but bash.
      - run: shellcheck deploy/deploy.sh deploy/deploy_test.sh internal/server/handlers/assets/install.sh scripts/release.sh scripts/release_test.sh scripts/changelog.sh scripts/changelog_test.sh
      - run: make test-deploy
      - run: make test-release
      - run: make test-changelog

  migrate:
    name: Migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mdfly
          POSTGRES_USER: mdfly
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz \
            -o /tmp/migrate.tar.gz
          echo "2ac648fbd1b127b69ab5a7b33cf96212178f71e22379fc50573630c6f4c7ce18  /tmp/migrate.tar.gz" | sha256sum -c -
          tar xz -C /tmp -f /tmp/migrate.tar.gz
          sudo mv /tmp/migrate /usr/local/bin/migrate
      - name: Migrate up
        env:
          DATABASE_URL: postgres://mdfly:secret@localhost:5432/mdfly?sslmode=disable
        run: make migrate-up
      - name: Verify indexes
        run: |
          psql -t -A postgres://mdfly:secret@localhost:5432/mdfly?sslmode=disable \
            -c "SELECT EXISTS(SELECT 1 FROM pg_indexes WHERE indexname='documents_pending_gc_idx');" \
            | grep -qx 't'
          psql -t -A postgres://mdfly:secret@localhost:5432/mdfly?sslmode=disable \
            -c "SELECT EXISTS(SELECT 1 FROM pg_indexes WHERE indexname='documents_anon_expiry_idx');" \
            | grep -qx 't'
          psql -t -A postgres://mdfly:secret@localhost:5432/mdfly?sslmode=disable \
            -c "SELECT EXISTS(SELECT 1 FROM pg_indexes WHERE indexname='documents_owner_idx');" \
            | grep -qx 't'
      - name: Migrate down
        env:
          DATABASE_URL: postgres://mdfly:secret@localhost:5432/mdfly?sslmode=disable
        run: echo y | migrate -path migrations -database "$DATABASE_URL" down
      - name: Verify rollback
        run: |
          result=$(psql -t -A postgres://mdfly:secret@localhost:5432/mdfly?sslmode=disable \
            -c "SELECT to_regclass('public.documents');")
          if [ "$result" = "public.documents" ]; then
            echo "ERROR: documents table still exists after rollback" >&2
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build

  # A malformed .goreleaser.yaml would otherwise surface only after a tag is
  # pushed, when the version is already spent and has to be deleted to retry.
  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  # Publishes the ARM image the box pulls (ADR-0015). Gated on every other job,
  # and on main only: a branch you are still hacking on must not produce a
  # deployable artifact. The package stays private — the binary carries no
  # secrets, but its SQL and route names survive compilation as readable strings.
  publish:
    name: Publish image
    needs: [lint, test, migrate, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # The free private-package allowance is 500 MB at roughly 25 MB a version,
      # so retention is part of the build rather than a thing to remember.
      RETAINED_VERSIONS: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the image name for GHCR and derives the source-repo label that
      # links the package to this repo — without that link, the repo-scoped token
      # below cannot prune.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=

      # linux/arm64 only, cross-compiled by the Dockerfile's build-platform
      # builder stage. No QEMU is set up, deliberately: emulating the compile
      # would turn seconds into minutes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          versions=$(gh api "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100" \
            --jq "sort_by(.created_at) | reverse | .[${RETAINED_VERSIONS}:][]
                  | \"\(.id)\t\(.metadata.container.tags | join(\",\"))\"")
          if [ -z "$versions" ]; then
            echo "Nothing to prune: at most $RETAINED_VERSIONS versions exist."
            exit 0
          fi
          count=0
          while IFS=$'\t' read -r id tags; do
            echo "Deleting version $id (tags: ${tags:-<untagged>})"
            gh api -X DELETE "/users/$OWNER/packages/container/$PACKAGE/versions/$id"
            count=$((count + 1))
          done <<< "$versions"
          echo "Pruned $count version(s); newest $RETAINED_VERSIONS retained."
