name: Release

# Tag-driven, not branch-driven: the tag is the version, and goreleaser refuses
# to run on a dirty or untagged tree. Tag only commits that already passed CI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      # Every third-party action is pinned to a full commit SHA, not a tag: a tag
      # is mutable, and this job holds a token that can write to the tap repo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # goreleaser refuses to run against a shallow clone, and a depth-1 fetch
          # would not carry the tag it stamps into the binary either.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The Release body is written by hand. This fails the job when the tag has no
      # CHANGELOG.md section, which is the same refusal release.sh makes locally —
      # kept here too because a hand-pushed tag skips that script entirely.
      - name: Assemble release notes
        run: |
          ./scripts/changelog.sh extract "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          cat .github/release-footer.md >> "$RUNNER_TEMP/notes.md"

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Exact, not "~> v2": a floating constraint means the binary that cuts
          # a release is chosen at run time and cannot be reproduced afterwards.
          version: "v2.17.1"
          # The notes live under RUNNER_TEMP, not in the repo: goreleaser aborts on
          # a dirty tree, so writing them next to the source would fail the build.
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          # Uploads the Release to this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes the cask into Abir66/homebrew-mdfly. GITHUB_TOKEN cannot
          # reach a second repository, so this is a fine-grained PAT scoped to
          # contents:write on the tap repo and nothing else.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
